<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>旅遊足跡隨手拍 - 雙圖自動同步相機 (v5)</title>
  <!-- 加上版本參數 ?v=5 避免手機快取舊版 -->
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div class="app-container">
    <!-- 頂部導航與功能列 -->
    <header class="top-bar">
      <div class="title-section">
        <span class="app-icon">📷</span>
        <h1 class="app-title">旅遊相機 <span class="version-tag">v5 秒拍</span></h1>
      </div>

      <!-- 背景雲端上傳狀態徽章 (非侵入式，完全不擋拍照) -->
      <div id="cloudSyncBadge" class="sync-badge idle" title="雲端同步狀態">
        <span class="sync-icon">☁️</span>
        <span id="syncText" class="sync-text">已連線</span>
      </div>

      <div class="top-actions">
        <button id="btnSwitchCamera" class="icon-button" title="切換前後鏡頭">🔄 翻轉</button>
        <button id="btnSettings" class="icon-button" title="雲端硬碟設定">⚙️ 設定</button>
      </div>
    </header>

    <!-- 旅遊行程標題自訂列 -->
    <div class="trip-bar">
      <label for="tripTitleInput" class="trip-label">🎒 主題：</label>
      <input type="text" id="tripTitleInput" class="trip-input" value="2026 歡樂旅遊紀錄" placeholder="輸入本次旅行名稱">
    </div>

    <!-- 即時定位與狀態顯示條 -->
    <div class="status-card">
      <div class="status-row">
        <span class="status-indicator" id="gpsIndicator"></span>
        <span class="status-text" id="gpsStatus">正在搜尋衛星定位...</span>
      </div>
      <div class="address-row" id="addressDisplay">門牌地址載入中...</div>
    </div>

    <!-- 主要相機觀景窗 -->
    <main class="viewport-area" id="viewportArea">
      <!-- 視訊即時取景畫面 -->
      <video id="cameraVideo" autoplay playsinline webkit-playsinline muted class="camera-stream"></video>

      <!-- 九宮格構圖線 -->
      <div class="grid-overlay">
        <div class="grid-line horizontal h1"></div>
        <div class="grid-line horizontal h2"></div>
        <div class="grid-line vertical v1"></div>
        <div class="grid-line vertical v2"></div>
      </div>

      <!-- 鏡頭點擊喚醒按鈕 (初次進入提示) -->
      <div id="cameraPromptOverlay" class="camera-prompt-overlay">
        <div class="prompt-icon">📸</div>
        <div class="prompt-title">相機鏡頭準備中</div>
        <div class="prompt-desc">請輕碰下方按鈕，並點選「允許相機」即可開始取景！</div>
        <button id="btnStartCameraManual" class="btn primary-btn prompt-btn">🚀 啟動相機畫面</button>
      </div>

      <!-- 快門閃光層 -->
      <div id="shutterFlash" class="shutter-flash"></div>

      <!-- 拍照成功右上角微提示通知 (0.8秒自動消失，不擋鏡頭) -->
      <div id="quickToast" class="quick-toast">✓ 已拍下，背景傳送中</div>

      <!-- 背景畫布 (隱藏，用於產生雙版本照片) -->
      <canvas id="cleanCanvas" style="display: none;"></canvas>
      <canvas id="stampedCanvas" style="display: none;"></canvas>

      <!-- 照片檢視與存手機彈窗 (點擊左下角縮圖才打開，不影響平時連續拍照) -->
      <div id="previewModal" class="modal-overlay" style="display: none;">
        <div class="modal-box preview-modal-box">
          <div class="preview-tabs">
            <button id="tabStamped" class="tab-btn active">打卡印章圖 (A)</button>
            <button id="tabClean" class="tab-btn">純淨原圖 (B)</button>
            <button id="btnClosePreview" class="close-tab-btn" title="關閉檢視">&times;</button>
          </div>
          <div class="preview-image-wrapper">
            <img id="previewImg" src="" alt="照片預覽" class="preview-img">
          </div>
          <div class="modal-footer preview-footer">
            <button id="btnSaveLocal" class="btn primary-btn">💾 存入手機相簿</button>
            <button id="btnForceUpload" class="btn secondary-btn">☁️ 重新立即同步</button>
          </div>
        </div>
      </div>
    </main>

    <!-- 底部操作列 (特別墊高避開狀態列與導航條) -->
    <footer class="bottom-controls" id="cameraControls">
      <!-- 左側：最新拍攝照片縮圖 (點擊可檢視/下載，不點就直接繼續拍！) -->
      <div id="thumbnailContainer" class="thumbnail-wrapper" title="點擊檢視最新照片">
        <img id="latestThumbImg" class="thumb-img" src="" alt="縮圖" style="display: none;">
        <div id="thumbPlaceholder" class="thumb-placeholder">🖼️</div>
      </div>

      <!-- 中間：紅色大快門 (零延遲秒拍) -->
      <button id="btnCapture" class="shutter-button" title="按下快門秒拍">
        <div class="shutter-outer">
          <div class="shutter-inner"></div>
        </div>
      </button>

      <!-- 右側：重新定位按鈕 -->
      <button id="btnRefreshGps" class="side-control-btn" title="重新抓取目前位置">
        <span class="control-icon">📍</span>
        <span class="control-text">重整定位</span>
      </button>
    </footer>

    <!-- 設定對話框 -->
    <div id="settingsModal" class="modal-overlay" style="display: none;">
      <div class="modal-box">
        <div class="modal-header">
          <h2>Google 雲端硬碟同步設定</h2>
          <button id="btnCloseSettings" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <p class="modal-desc">
            您的專屬接收小幫手 (Google Apps Script) 網址：
          </p>
          <input type="url" id="gasUrlInput" class="modal-input" placeholder="https://script.google.com/macros/s/.../exec">
          
          <div class="switch-row">
            <label class="switch-label">啟用背景默默同步：</label>
            <input type="checkbox" id="autoUploadCheck" checked>
          </div>

          <div class="switch-row">
            <label class="switch-label">拍照時自動下載到手機相簿：</label>
            <input type="checkbox" id="autoDownloadCheck">
          </div>

          <div class="tips-box">
            <p>💡 <b>老師貼心叮嚀（秒拍架構）：</b></p>
            <p>現在按下快門會「立即完成拍照」，觀景窗不會中斷！照片會自動排隊在背景默默上傳至 Google 雲端硬碟，你完全不需要站在原地等待喔！</p>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btnSaveSettings" class="btn primary-btn">儲存設定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 引入最新版腳本 -->
  <script src="app.js?v=5"></script>
</body>
</html>
